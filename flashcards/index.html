<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash cards tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2e4;
    --ink: #11281b;
    --muted: #4c6354;
    --court: #1d5c3c;
    --court-ink: #f6f9ee;
    --line: rgba(246, 249, 238, 0.9);
    --ball: #dcf53c;
    --ball-ink: #11281b;
    --chip: #ffffff;
    --chip-border: #c5d1b8;
    --chip-on: #11281b;
    --chip-on-ink: #f6f9ee;
    --ok: #1d5c3c;
    --ok-ink: #f6f9ee;
    --retry: #ffffff;
    --retry-ink: #11281b;
    --track: #d3dcc6;
    --focus: #e0561b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1a13;
      --ink: #eaf2de;
      --muted: #9db3a3;
      --court: #17503a;
      --court-ink: #f6f9ee;
      --ball: #d4ee38;
      --ball-ink: #11281b;
      --chip: #16271d;
      --chip-border: #2d4636;
      --chip-on: #dcf53c;
      --chip-on-ink: #11281b;
      --ok: #dcf53c;
      --ok-ink: #11281b;
      --retry: #16271d;
      --retry-ink: #eaf2de;
      --track: #2a4033;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1a13;
    --ink: #eaf2de;
    --muted: #9db3a3;
    --court: #17503a;
    --court-ink: #f6f9ee;
    --ball: #d4ee38;
    --ball-ink: #11281b;
    --chip: #16271d;
    --chip-border: #2d4636;
    --chip-on: #dcf53c;
    --chip-on-ink: #11281b;
    --ok: #dcf53c;
    --ok-ink: #11281b;
    --retry: #16271d;
    --retry-ink: #eaf2de;
    --track: #2a4033;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 {
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.9rem;
    line-height: 1.1;
    margin: 4px 0 4px;
    letter-spacing: 0.2px;
  }
  .back { display: inline-block; font-weight: 700; color: var(--muted); text-decoration: none; padding: 4px 0; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 0.98rem; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    font: inherit; font-weight: 700; font-size: 0.9rem;
    border: 1.5px solid var(--chip-border);
    background: var(--chip); color: var(--ink);
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 0.9rem; color: var(--muted); font-weight: 700; }
  .shuffle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .shuffle input { width: 18px; height: 18px; accent-color: var(--court); }
  .track { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .fill { height: 100%; width: 0; background: var(--court); transition: width .25s ease; }

  .scene { perspective: 1200px; }
  .card {
    position: relative; display: grid; width: 100%;
    min-height: 330px; cursor: pointer;
    font: inherit; color: inherit; text-align: left;
    -webkit-tap-highlight-color: transparent;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.3,.7,.3,1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1;
    position: relative; height: 100%; min-height: 330px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 18px;
    padding: 30px 26px;
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
  }
  .front { background: var(--court); color: var(--court-ink); }
  .front::before {
    content: ""; position: absolute; inset: 11px;
    border: 2px solid var(--line); border-radius: 8px; pointer-events: none;
  }
  .back { background: var(--ball); color: var(--ball-ink); transform: rotateY(180deg); }
  .cat {
    align-self: flex-start;
    font-weight: 800; font-size: 0.82rem;
    padding: 3px 11px; border-radius: 99px;
    background: rgba(246,249,238,.16);
  }
  .back .cat { background: rgba(17,40,27,.12); }
  .q { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 500; font-size: 1.32rem; line-height: 1.3; margin: 0; }
  .a { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 700; font-size: 1.85rem; line-height: 1.2; margin: 0; }
  .n { margin: 0; font-size: 1rem; font-weight: 600; opacity: .85; }
  .hint { margin: 10px 0 0; text-align: center; font-size: .9rem; color: var(--muted); font-weight: 600; min-height: 1.3em; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .btn {
    font: inherit; font-weight: 800; font-size: 1rem;
    padding: 13px 10px; border-radius: 14px; cursor: pointer;
    border: 2px solid var(--court);
  }
  .btn.retry { background: var(--retry); color: var(--retry-ink); border-color: var(--chip-border); }
  .btn.ok { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); }
  .btn:disabled { opacity: .4; cursor: default; }
  .nav { display: flex; justify-content: space-between; margin-top: 14px; }
  .link { font: inherit; font-weight: 700; background: none; border: 0; color: var(--muted); padding: 8px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .link:disabled { opacity: .35; cursor: default; text-decoration: none; }

  .done { background: var(--court); color: var(--court-ink); border-radius: 18px; padding: 32px 26px; text-align: center; }
  .done h2 { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 600; font-size: 1.7rem; margin: 0 0 6px; }
  .done .score { font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-size: 3rem; font-weight: 700; margin: 4px 0 14px; color: var(--ball); }
  .done .btn { width: 100%; margin-top: 10px; background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }
  .done .btn.alt { background: transparent; color: var(--court-ink); border-color: var(--line); }

  .foot { margin-top: 26px; font-size: .85rem; color: var(--muted); }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .fill { transition: none; }
  }
  @media (max-width: 360px) {
    .q { font-size: 1.2rem; }
    .a { font-size: 1.6rem; }
    .face { padding: 26px 22px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← Accueil</a>
  <h1>Flash cards tennis</h1>
  <p class="sub">Compter les points, servir du bon côté, changer de côté, se placer.</p>

  <div class="chips" id="chips" role="group" aria-label="Choisir un thème"></div>

  <div class="bar">
    <span id="count" aria-live="polite"></span>
    <label class="shuffle"><input type="checkbox" id="shuffle" checked> Mélanger</label>
  </div>
  <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>

  <div id="stage"></div>

  <p class="foot">Format jeunes : pas d'avantage (point décisif à 40A, le relanceur choisit le côté) et super tie-break à 10 points à la place du 3e set. Si ton club joue d'autres règles, ton coach te dira.</p>
</main>

<script>

  { id: "changer", label: "Changer de côté" },

];

const CARDS = [
  /* ---------- Compter les points ---------- */
  { c: "points", q: "Je sers. Le score est 0/0. Je gagne le point. Quel est le score ?", a: "15/0", n: "On compte 0, 15, 30, 40, puis jeu." },
  { c: "points", q: "Je sers. Le score est 15/0. Je gagne le point. Quel est le score ?", a: "30/0" },
  { c: "points", q: "Je sers. Le score est 30/0. Je gagne le point. Quel est le score ?", a: "40/0" },
  { c: "points", q: "Je sers. Le score est 40/0. Je gagne le point. Que se passe-t-il ?", a: "Je gagne le jeu !", n: "Il faut 4 points pour gagner un jeu." },
  { c: "points", q: "Je sers. Le score est 30/15. Je perds le point. Quel est le score ?", a: "30/30", n: "On dit « 30 partout »." },
  { c: "points", q: "Je sers. Le score est 30/30. Je gagne le point. Quel est le score ?", a: "40/30" },
  { c: "points", q: "Je sers. Le score est 40/30. Je perds le point. Quel est le score ?", a: "40A (égalité)", n: "Chez les jeunes, il n'y a pas d'avantage : le prochain point est décisif." },
  { c: "points", q: "Je sers. Le score est 15/40. Je gagne le point. Quel est le score ?", a: "30/40" },

  { c: "points", q: "Je reçois le service. Le score est 0/40 (0 pour le serveur, 40 pour moi). Je gagne le point. Que se passe-t-il ?", a: "Je gagne le jeu !", n: "J'ai pris le service de l'adversaire : c'est un « break »." },
  { c: "points", q: "Qu'est-ce que le point décisif ?", a: "À 40A, on joue un seul point : celui qui le gagne gagne le jeu.", n: "Il n'y a pas d'avantage chez les jeunes." },
  { c: "points", q: "Le score est 40A. Je gagne le point. Que se passe-t-il ?", a: "Je gagne le jeu !", n: "C'est le point décisif." },

  { c: "points", q: "Tie-break : le score est 6-6. Combien de points faut-il pour gagner ?", a: "Gagner 2 points de suite.", n: "On continue : 8-6, 9-7... il faut toujours 2 points d'écart." },

  { c: "points", q: "Chacun a gagné 1 set. Que joue-t-on pour le 3e set ?", a: "Un super tie-break à 10 points.", n: "Chez les jeunes, il n'y a pas de 3e set en jeux." },
  { c: "points", q: "Dans un super tie-break, comment compte-t-on les points ?", a: "1, 2, 3, 4... (pas 15, 30, 40)", n: "Le premier à 10 points gagne, avec 2 points d'écart." },

  { c: "servir", q: "Je sers. Le score est 0/0. De quel côté je sers ?", a: "À droite", n: "On commence toujours un jeu à droite." },

  { c: "servir", q: "L'astuce pour savoir où servir ?", a: "Je compte les points joués : pair → droite, impair → gauche.", n: "15 = 1 point, 30 = 2 points, 40 = 3 points. Sauf au point décisif (40A) : le relanceur choisit." },
  { c: "servir", q: "Ma première balle est faute. De quel côté je sers ma deuxième balle ?", a: "Du même côté", n: "Le côté ne change qu'après un point terminé." },
  { c: "servir", q: "Je sers de la droite. Dans quel carré de service la balle doit-elle tomber ?", a: "Dans le carré en diagonale, de l'autre côté du filet.", n: "Je sers toujours en croisé." },

  { c: "changer", q: "Tie-break : qui sert le premier point, et de quel côté ?", a: "Un seul point, à droite. Ensuite chacun sert 2 points de suite, en commençant à gauche.", n: "Droite, puis (2 points) gauche + droite, et ainsi de suite." },

  { c: "changer", q: "Dans un super tie-break, quand change-t-on de côté ?", a: "Tous les 6 points.", n: "Quand le total des points est 6, 12, 18..." },
  { c: "changer", q: "Super tie-break : le score est 4-2. Change-t-on de côté ?", a: "Oui", n: "4 + 2 = 6 points joués." },
  { c: "changer", q: "Super tie-break : le score est 5-3. Change-t-on de côté ?", a: "Non, pas encore.", n: "8 points joués. On change à 6, puis à 12." },
  { c: "changer", q: "Super tie-break : le score est 7-5. Change-t-on de côté ?", a: "Oui", n: "7 + 5 = 12 points joués." },
  { c: "changer", q: "Super tie-break : qui sert le premier point, et de quel côté ?", a: "Celui dont c'est le tour de servir, à droite. Ensuite chacun sert 2 points de suite, en commençant à gauche.", n: "Même rythme que le tie-break normal." },

  /* ---------- Se placer ---------- */
  { c: "placer", q: "Je sers. Où je me place ?", a: "Derrière la ligne de fond, près de la marque du milieu.", n: "Un peu à droite de la marque quand je sers à droite, un peu à gauche quand je sers à gauche." },
  { c: "placer", q: "Mon adversaire sert de sa droite. Où dois-je me placer pour recevoir ?", a: "Du côté droit de mon terrain, en diagonale de lui.", n: "Le service est toujours en croisé." },
  { c: "placer", q: "Je reçois le service. Où je me place sur le terrain ?", a: "Derrière la ligne de fond.", n: "Je recule sur un gros service. J'avance d'un pas sur une deuxième balle." },
  { c: "placer", q: "Mon adversaire va frapper la balle. Que fais-je avec mes jambes ?", a: "Un petit saut d'allégement pour être prêt à partir.", n: "Je le fais juste au moment où l'adversaire frappe la balle." },
  { c: "placer", q: "L'adversaire me renvoie une balle courte (qui retombe près du filet). Que fais-je ?", a: "J'avance vers la balle pour la jouer, puis je peux monter au filet." },
  { c: "placer", q: "Je joue une balle croisée. Où dois-je me replacer ?", a: "Au milieu de ce que l'adversaire peut me renvoyer.", n: "Je me replace un peu du côté de ma balle, pas forcément au centre exact." },
  { c: "placer", q: "Je suis au filet. À quelle distance du filet je me place ?", a: "Environ 2 mètres, au milieu du terrain.", n: "Assez près pour finir le point, assez loin pour jouer les lobs." }
];

const chipsEl = document.getElementById("chips");
const stage = document.getElementById("stage");
const countEl = document.getElementById("count");
const fillEl = document.getElementById("fill");
const shuffleEl = document.getElementById("shuffle");
const catLabel = Object.fromEntries(CATS.map(c => [c.id, c.label]));

let cat = "all";
let deck = [];
let idx = 0;
let flipped = false;
let known = 0;
let missed = [];

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

function startDeck(cards) {
  deck = shuffleEl.checked ? shuffled(cards) : cards.slice();
  idx = 0; flipped = false; known = 0; missed = [];
  render();
}

function filtered() {
  return cat === "all" ? CARDS : CARDS.filter(c => c.c === cat);
}

function drawChips() {
  chipsEl.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = c.label;
    b.setAttribute("aria-pressed", String(c.id === cat));
    b.addEventListener("click", () => { cat = c.id; drawChips(); startDeck(filtered()); });
    chipsEl.appendChild(b);
  });
}

function render() {
  const total = deck.length;
  fillEl.style.width = (total ? Math.min(idx, total) / total * 100 : 0) + "%";

  if (idx >= total) {
    countEl.textContent = "Série terminée";
    stage.innerHTML =
      '<div class="done">' +
        '<h2>Bravo !</h2>' +
        '<div class="score">' + known + ' / ' + total + '</div>' +
        '<div>' + (missed.length ? "cartes que tu savais" : "Tu savais tout, champion !") + '</div>' +
        (missed.length ? '<button class="btn" id="redoMissed" type="button">Refaire les ' + missed.length + ' cartes à revoir</button>' : '') +
        '<button class="btn alt" id="redoAll" type="button">Recommencer la série</button>' +
      '</div>';
    const rm = document.getElementById("redoMissed");
    if (rm) rm.addEventListener("click", () => startDeck(missed.slice()));
    document.getElementById("redoAll").addEventListener("click", () => startDeck(filtered()));
    return;
  }

  const k = deck[idx];
  countEl.textContent = "Carte " + (idx + 1) + " sur " + total;
  stage.innerHTML =
    '<div class="scene">' +
      '<div class="card' + (flipped ? " flipped" : "") + '" id="card" role="button" tabindex="0" aria-label="Carte : retourner pour voir la réponse">' +
        '<div class="face front" aria-hidden="' + flipped + '">' +
          '<span class="cat">' + esc(catLabel[k.c]) + '</span>' +
          '<p class="q">' + esc(k.q) + '</p>' +
        '</div>' +
        '<div class="face back" aria-hidden="' + (!flipped) + '">' +
          '<span class="cat">Réponse</span>' +
          '<p class="a">' + esc(k.a) + '</p>' +
          (k.n ? '<p class="n">' + esc(k.n) + '</p>' : '') +
        '</div>' +
      '</div>' +
    '</div>' +
    '<p class="hint" id="hint">' + (flipped ? "Tu le savais ?" : "Touche la carte pour voir la réponse") + '</p>' +
    '<div class="actions">' +
      '<button class="btn retry" id="retry" type="button"' + (flipped ? "" : " disabled") + '>À revoir</button>' +
      '<button class="btn ok" id="ok" type="button"' + (flipped ? "" : " disabled") + '>Je savais</button>' +
    '</div>' +
    '<div class="nav">' +
      '<button class="link" id="prev" type="button"' + (idx === 0 ? " disabled" : "") + '>Précédente</button>' +
      '<button class="link" id="skip" type="button">Passer</button>' +
    '</div>';

  const card = document.getElementById("card");
  card.addEventListener("click", flip);
  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
  document.getElementById("retry").addEventListener("click", () => answer(false));
  document.getElementById("ok").addEventListener("click", () => answer(true));
  document.getElementById("prev").addEventListener("click", () => go(-1));
  document.getElementById("skip").addEventListener("click", () => { missed.push(deck[idx]); go(1); });
}

function flip() {
  flipped = !flipped;
  const card = document.getElementById("card");
  card.classList.toggle("flipped", flipped);
  card.querySelector(".front").setAttribute("aria-hidden", String(flipped));
  card.querySelector(".back").setAttribute("aria-hidden", String(!flipped));
  document.getElementById("retry").disabled = !flipped;
  document.getElementById("ok").disabled = !flipped;
  document.getElementById("hint").textContent = flipped ? "Tu le savais ?" : "Touche la carte pour voir la réponse";
}

function answer(ok) {
  if (ok) known++; else missed.push(deck[idx]);
  go(1);
}

function go(step) {
  idx = Math.max(0, idx + step);
  flipped = false;
  render();
}

document.addEventListener("keydown", e => {
  if (idx >= deck.length) return;
  if (e.key === "ArrowRight") { go(1); }
  else if (e.key === "ArrowLeft") { go(-1); }
});

shuffleEl.addEventListener("change", () => startDeck(filtered()));

drawChips();
startDeck(filtered());
</script>
</body>
</html>
